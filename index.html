<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Group Payment</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generation Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* Using a nice gradient background for a modern feel */
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
        }
        /* Custom styles for the main card to give it a floating effect */
        .payment-card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        /* Custom focus styles for better accessibility and look */
        .custom-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
            border-color: #3B82F6;
        }
        /* Simple spinner for loading states */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Styling for the QR code container */
        #qrcode {
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: white;
        }
        /* Adding transitions for a smoother UI experience */
        button, input {
            transition: all 0.2s ease-in-out;
        }
        /* --- NEW STYLES FOR CUSTOM DROPDOWN --- */
        .custom-scrollbar::-webkit-scrollbar {
          width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: #1f2937; /* bg-gray-800 */
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #4b5563; /* bg-gray-600 */
          border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #6b7280; /* bg-gray-500 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md mx-auto payment-card rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        <!-- Header Section -->
        <header class="text-center">
            <!-- New stylish logo -->
            <div class="mx-auto bg-blue-500 rounded-full w-16 h-16 flex items-center justify-center shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">L-Group Payment</h1>
            <p class="text-gray-500 mt-1">ប្រព័ន្ធស្វែងរក និងទូទាត់ប្រាក់</p>
        </header>

        <!-- Search Section -->
        <div class="space-y-4">
            <!-- MODIFIED: Added a relative container for dropdown positioning -->
            <div id="searchContainer" class="relative">
                <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
                <div class="mt-1 flex rounded-xl shadow-sm">
                    <!-- REMOVED the list="studentList" attribute -->
                    <input type="text" id="studentName" class="flex-1 block w-full rounded-none rounded-l-xl border-gray-300 p-3 custom-focus" placeholder="Type to search for a name...">
                    <button id="searchBtn" class="inline-flex items-center justify-center px-4 py-2 border border-l-0 border-gray-300 rounded-r-xl bg-blue-500 text-white font-semibold hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        <!-- Search Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <!-- NEW: Custom dropdown container -->
                <div id="autocompleteDropdown" class="hidden absolute z-10 w-full mt-1 bg-gray-800 text-white rounded-lg shadow-xl max-h-60 overflow-y-auto custom-scrollbar">
                    <!-- Dropdown items will be inserted here by JavaScript -->
                </div>
            </div>
             <!-- Message display area -->
            <div id="message" class="text-center text-sm font-medium h-5"></div>
        </div>

        <!-- Student Info & Payment Section (Initially Hidden) -->
        <div id="paymentSection" class="hidden space-y-5 pt-5 border-t">
             <!-- Display Info -->
            <div class="bg-gray-50 p-4 rounded-xl shadow-inner space-y-3">
                <div class="flex justify-between items-center">
                    <p class="font-semibold text-gray-600">Room:</p>
                    <p id="roomDisplay" class="text-gray-900 font-bold text-lg"></p>
                </div>
                <div class="flex justify-between items-center">
                    <p class="font-semibold text-gray-600">Generation:</p>
                    <p id="generationDisplay" class="text-gray-900 font-bold text-lg"></p>
                </div>
            </div>
            
            <!-- Amount Input -->
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700">Amount (KHR)</label>
                <input type="number" id="amount" class="mt-1 block w-full rounded-xl border-gray-300 shadow-sm p-3 custom-focus" placeholder="e.g., 5000">
            </div>

            <!-- Bank Selection -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="processPayment('ABA')" class="flex items-center justify-center w-full bg-white text-red-600 font-bold py-3 px-4 rounded-xl shadow-md border border-red-200 hover:bg-red-50 hover:shadow-lg transform hover:-translate-y-1">
                    <img src="aba.png" alt="ABA Logo" class="h-6 mr-2">
                    ABA PAY
                </button>
                <button onclick="processPayment('ACLEDA')" class="flex items-center justify-center w-full bg-white text-blue-800 font-bold py-3 px-4 rounded-xl shadow-md border border-blue-200 hover:bg-blue-50 hover:shadow-lg transform hover:-translate-y-1">
                     <img src="ac.png" alt="ACLEDA Logo" class="h-6 mr-2">
                    ACLEDA
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for QR Code Display and Confirmation -->
    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-60 overflow-y-auto h-full w-full flex items-center justify-center hidden p-4">
      <div class="relative mx-auto p-6 border w-full max-w-sm shadow-2xl rounded-2xl bg-white text-center">
        <h3 class="text-xl leading-6 font-bold text-gray-900" id="modalTitle">Scan to Pay</h3>
        <div class="mt-4 px-2 py-3">
          <div id="qrcode-container">
            <div id="qrcode" class="mx-auto w-52 h-52 mb-4 p-2 border rounded-lg"></div>
            <p class="text-sm text-gray-600 mt-2">
              Scan with your banking app to pay <strong id="modalAmount" class="text-blue-600 font-bold"></strong> KHR.
            </p>
          </div>
           <p id="modalMessage" class="mt-4 text-base font-semibold text-gray-800 h-6"></p>
        </div>
        <div id="modal-buttons" class="items-center px-4 py-3 space-y-3 mt-2">
          <button id="confirmPaymentBtn" class="px-4 py-3 bg-green-500 text-white text-base font-bold rounded-xl w-full shadow-lg hover:bg-green-600 focus:outline-none focus:ring-2 ring-offset-2 ring-green-400 transform hover:scale-105">
            I Have Paid
          </button>
          <button id="cancelPaymentBtn" class="px-4 py-3 bg-gray-200 text-gray-800 text-base font-medium rounded-xl w-full hover:bg-gray-300 focus:outline-none focus:ring-2 ring-offset-2 ring-gray-400">
            Cancel
          </button>
        </div>
      </div>
    </div>

<script>
    // === IMPORTANT: PASTE YOUR SCRIPT URL HERE ===
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-iHvxVBky6brPzt8hiiyOihHePT_6VITUKKD6uknRpxhfWKwAKdQ9fpVsCAMMGFOn/exec';
    
    // === IMPORTANT: ENTER YOUR BANK DETAILS HERE ===
    const MERCHANT_INFO = {
        name: "YOUR FULL NAME", // Your name as it appears in the bank app
        city: "Phnom Penh",      // Your city
        aba: {
            account: "000123456" // Your ABA Bank Account Number
        },
        acleda: {
            account: "000987654" // Your ACLEDA Bank Account Number
        }
    };

    // DOM Elements
    const searchContainer = document.getElementById('searchContainer');
    const searchBtn = document.getElementById('searchBtn');
    const studentNameInput = document.getElementById('studentName');
    const autocompleteDropdown = document.getElementById('autocompleteDropdown'); // New dropdown
    const messageDiv = document.getElementById('message');
    const paymentSection = document.getElementById('paymentSection');
    const roomDisplay = document.getElementById('roomDisplay');
    const generationDisplay = document.getElementById('generationDisplay');
    const amountInput = document.getElementById('amount');
    
    // Modal elements
    const qrModal = document.getElementById('qrModal');
    const qrCodeContainer = document.getElementById('qrcode');
    const qrCodeDisplayContainer = document.getElementById('qrcode-container');
    const cancelPaymentBtn = document.getElementById('cancelPaymentBtn');
    const confirmPaymentBtn = document.getElementById('confirmPaymentBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalAmount = document.getElementById('modalAmount');
    const modalMessage = document.getElementById('modalMessage');
    const modalButtons = document.getElementById('modal-buttons');

    let currentStudent = null;
    let qrCodeInstance = null;
    let pendingPaymentData = null; 
    let allStudentNames = []; // To store all names for filtering

    function isMobileDevice() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'getStudentNames' })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success' && Array.isArray(response.data)) {
                allStudentNames = response.data; // Store names
            } else { console.error("Failed to load student names:", response.message); }
        })
        .catch(error => { console.error("Error fetching student names:", error); });
    });

    // --- NEW DROPDOWN LOGIC ---
    
    function updateDropdown(filter = '') {
        autocompleteDropdown.innerHTML = '';
        const filteredNames = allStudentNames.filter(name => name.toLowerCase().includes(filter.toLowerCase()));
        
        if (filteredNames.length === 0) {
            autocompleteDropdown.classList.add('hidden');
            return;
        }

        filteredNames.forEach(name => {
            const item = document.createElement('div');
            item.className = 'p-3 hover:bg-gray-700 cursor-pointer';
            item.textContent = name;
            item.addEventListener('mousedown', (e) => { // Use mousedown to fire before blur
                e.preventDefault();
                studentNameInput.value = name;
                autocompleteDropdown.classList.add('hidden');
                findStudent();
            });
            autocompleteDropdown.appendChild(item);
        });
        autocompleteDropdown.classList.remove('hidden');
    }

    studentNameInput.addEventListener('input', () => updateDropdown(studentNameInput.value));
    studentNameInput.addEventListener('focus', () => updateDropdown(studentNameInput.value));
    
    // Hide dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!searchContainer.contains(e.target)) {
            autocompleteDropdown.classList.add('hidden');
        }
    });

    // --- END NEW DROPDOWN LOGIC ---

    // Event listeners
    searchBtn.addEventListener('click', findStudent);
    studentNameInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') findStudent(); });
    
    cancelPaymentBtn.addEventListener('click', () => {
        qrModal.classList.add('hidden');
        resetForm();
    });

    confirmPaymentBtn.addEventListener('click', logTransaction);

    function findStudent() {
        autocompleteDropdown.classList.add('hidden'); // Hide dropdown on search
        const studentName = studentNameInput.value.trim();
        if (!studentName) return showMessage('Please enter a student name.', 'red');
        setLoading(true);
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'getStudentInfo', params: { studentName } })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success') onStudentFound(response.data);
            else throw new Error(response.message || 'Unknown error.');
        })
        .catch(onFailure);
    }

    function onStudentFound(studentData) {
        setLoading(false);
        if (studentData) {
            currentStudent = studentData;
            roomDisplay.textContent = studentData.room;
            generationDisplay.textContent = studentData.generation;
            paymentSection.classList.remove('hidden');
            showMessage(`Student found: ${studentData.name}`, 'green');
        } else {
            currentStudent = null;
            paymentSection.classList.add('hidden');
            showMessage('Student not found. Please check the name and try again.', 'red');
        }
    }

    function processPayment(bankName) {
        const amount = amountInput.value;
        if (!currentStudent) return showMessage('Please find a student first.', 'red');
        if (!amount || amount <= 0) {
            amountInput.focus();
            return showMessage('Please enter a valid amount.', 'red');
        }
        
        pendingPaymentData = {
            name: currentStudent.name,
            room: currentStudent.room,
            generation: currentStudent.generation,
            amount: parseFloat(amount),
            bank: bankName
        };

        modalTitle.textContent = `Pay with ${bankName}`;
        modalAmount.textContent = new Intl.NumberFormat('en-US').format(amount);
        qrModal.classList.remove('hidden');
        modalButtons.classList.remove('hidden');

        if (isMobileDevice()) {
            qrCodeDisplayContainer.classList.add('hidden'); 
            modalMessage.textContent = 'After paying in your bank app, return here and tap "I Have Paid".';
            
            let deepLinkUrl;
            if (bankName === 'ABA') {
                deepLinkUrl = `abamobile://pay?account_number=${MERCHANT_INFO.aba.account}&amount=${pendingPaymentData.amount}&currency=KHR`;
            } else if (bankName === 'ACLEDA') {
                deepLinkUrl = `acledatouch://`;
            }
            if (deepLinkUrl) window.location.href = deepLinkUrl;

        } else {
            qrCodeDisplayContainer.classList.remove('hidden'); 
            modalMessage.textContent = 'Please scan the QR code, then click "I Have Paid" to confirm.';
            generateKHQR(bankName, parseFloat(amount));
        }
    }
    
    function logTransaction() {
        if (!pendingPaymentData) return;
        
        confirmPaymentBtn.disabled = true;
        confirmPaymentBtn.innerHTML = `<div class="loader mx-auto"></div>`;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            credentials: 'omit',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'logPayment', params: { paymentData: pendingPaymentData } })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status !== 'success') {
                 throw new Error(response.message || 'Failed to log payment.');
            }
            onLogSuccess();
        })
        .catch(onFailure);
    }
    
    function onLogSuccess() {
        modalMessage.innerHTML = 'Transaction recorded. Thank you!';
        modalMessage.classList.remove('text-gray-800');
        modalMessage.classList.add('text-green-600');
        modalButtons.classList.add('hidden');
        setTimeout(() => {
            if (!qrModal.classList.contains('hidden')) {
                qrModal.classList.add('hidden');
                resetForm();
            }
        }, 3000);
    }

    function generateKHQR(bankName, amount) {
        const bakongProviderId = bankName === 'ABA' ? 'A000000677010111' : 'A000000677010112';
        const account = bankName === 'ABA' ? MERCHANT_INFO.aba.account : MERCHANT_INFO.acleda.account;
        const f = (id, value) => id + value.length.toString().padStart(2, '0') + value;
        let payload = [
            f('00', '01'), f('01', '12'), f('29', bakongProviderId + f('01', account)),
            f('52', '7102'), f('53', '156'), f('54', amount.toFixed(2)), f('58', 'KH'),
            f('59', MERCHANT_INFO.name), f('60', MERCHANT_INFO.city)
        ].join('');
        payload += '6304';
        let crc = 0xFFFF;
        for (let c = 0; c < payload.length; c++) {
            crc ^= payload.charCodeAt(c) << 8;
            for (let i = 0; i < 8; i++) {
                if (crc & 0x8000) crc = (crc << 1) ^ 0x1021;
                else crc <<= 1;
            }
        }
        crc &= 0xFFFF;
        const qrString = payload + crc.toString(16).toUpperCase().padStart(4, '0');
        qrCodeContainer.innerHTML = '';
        qrCodeInstance = new QRCode(qrCodeContainer, {
            text: qrString, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M
        });
    }

    function onFailure(error) {
        console.error('An error occurred:', error);
        const errorMessage = `Error: ${error.message}`;
        if (!qrModal.classList.contains('hidden')) {
            modalMessage.textContent = errorMessage;
            modalMessage.classList.remove('text-green-700', 'text-gray-800');
            modalMessage.classList.add('text-red-700');
            confirmPaymentBtn.disabled = false;
            confirmPaymentBtn.innerHTML = 'I Have Paid';
        } else {
            setLoading(false);
            showMessage(errorMessage, 'red');
        }
    }

    function setLoading(isLoading) {
        const searchIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>`;
        searchBtn.disabled = isLoading;
        searchBtn.innerHTML = isLoading ? `<div class="loader"></div>` : searchIcon;
    }
    
    function showMessage(msg, color) {
        messageDiv.textContent = msg;
        messageDiv.className = `text-center text-sm font-medium h-5 text-${color}-600`;
    }

    function resetForm() {
      studentNameInput.value = '';
      amountInput.value = '';
      paymentSection.classList.add('hidden');
      messageDiv.textContent = '';
      currentStudent = null;
      pendingPaymentData = null;
      confirmPaymentBtn.disabled = false;
      confirmPaymentBtn.innerHTML = 'I Have Paid';
      modalMessage.classList.remove('text-green-600', 'text-red-700');
      modalMessage.classList.add('text-gray-800');
    }

</script>
</body>
</html>
